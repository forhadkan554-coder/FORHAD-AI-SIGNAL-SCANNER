
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FORHAD AI SIGNAL SCANNER</title>
<style>
*{box-sizing:border-box}
body{
margin:0;padding:18px;
background:#071426;color:white;
font-family:Arial,sans-serif
}
.container{max-width:600px;margin:auto}
h1{text-align:center;color:#00e5ff;font-size:25px}
.card{
background:#10243d;padding:18px;
border-radius:14px;margin:15px 0;
border:1px solid #244766
}
input,select,button{
width:100%;padding:13px;margin:7px 0;
border-radius:8px;border:0;font-size:15px
}
button{background:#00c9a7;color:#001b24;font-weight:bold}
.price{font-size:30px;color:#00e5ff;text-align:center}
.signal{text-align:center;font-size:27px;font-weight:bold}
.green{color:#00e5a0}
.red{color:#ff5d70}
.yellow{color:#ffd166}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #29415b}
small{color:#aabbd0}
</style>
</head>
<body>
<div class="container">
<h1>FORHAD AI SIGNAL SCANNER</h1>
<p style="text-align:center;color:#00e5ff">LIVE MARKET DATA</p>

<div class="card">
<h3>API CONNECTION</h3>
<input id="api" type="password" placeholder="Enter Twelve Data API Key">
<button onclick="connect()">CONNECT</button>
<p id="status">Not connected</p>
</div>

<div class="card">
<h3>Select Market</h3>
<select id="pair">
<option value="EUR/USD">EUR/USD</option>
<option value="GBP/USD">GBP/USD</option>
<option value="USD/JPY">USD/JPY</option>
</select>
<button onclick="scan()">SCAN MARKET</button>
</div>

<div class="card">
<h3 id="market">EUR/USD</h3>
<div class="price" id="price">--</div>
<div class="signal yellow" id="signal">WAITING</div>
<div class="row"><span>RSI (14)</span><b id="rsi">--</b></div>
<div class="row"><span>EMA 9</span><b id="ema9">--</b></div>
<div class="row"><span>EMA 21</span><b id="ema21">--</b></div>
<div class="row"><span>Trend</span><b id="trend">--</b></div>
<div class="row"><span>Signal Strength</span><b id="strength">--</b></div>
<div class="row"><span>Data Status</span><b id="fresh">--</b></div>
</div>

<div class="card">
<small>Educational tool only. Signals are estimates, not financial advice. No guaranteed profit.</small>
</div>
</div>

<script>
let key="";

function connect(){
key=document.getElementById("api").value.trim();
if(!key){alert("Please enter API Key");return}
document.getElementById("status").innerText="API key entered. Testing...";
scan();
}

function ema(data,period){
let k=2/(period+1),v=data[0];
for(let i=1;i<data.length;i++)v=data[i]*k+v*(1-k);
return v;
}

function rsi(data){
let gain=0,loss=0;
for(let i=1;i<=14;i++){
let d=data[i-1]-data[i];
if(d>0)gain+=d;else loss-=d;
}
if(loss===0)return 100;
return 100-100/(1+gain/loss);
}

async function scan(){
if(!key){alert("Enter API Key first");return}
let pair=document.getElementById("pair").value;
document.getElementById("market").innerText=pair;
document.getElementById("status").innerText="Loading market data...";

try{
let url=`https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(pair)}&interval=1min&outputsize=50&apikey=${encodeURIComponent(key)}`;
let response=await fetch(url);
let result=await response.json();

if(!result.values)throw Error(result.message||"Data unavailable");

let values=result.values.map(x=>Number(x.close));
let current=values[0];
let e9=ema(values.slice().reverse(),9);
let e21=ema(values.slice().reverse(),21);
let r=rsi(values);

let up=e9>e21;
let signal="WAIT";
let strength=50;

if(up&&r>50&&r<70){signal="BUY";strength=75}
else if(!up&&r<50&&r>30){signal="SELL";strength=75}

document.getElementById("price").innerText=current;
document.getElementById("rsi").innerText=r.toFixed(2);
document.getElementById("ema9").innerText=e9.toFixed(5);
document.getElementById("ema21").innerText=e21.toFixed(5);
document.getElementById("trend").innerText=up?"UPTREND":"DOWNTREND";
document.getElementById("signal").innerText=signal;
document.getElementById("signal").className="signal "+(signal==="BUY"?"green":signal==="SELL"?"red":"yellow");
document.getElementById("strength").innerText=strength+"%";
document.getElementById("fresh").innerText="DATA RECEIVED";
document.getElementById("status").innerText="Connected";
}catch(e){
document.getElementById("status").innerText="Error: "+e.message;
document.getElementById("fresh").innerText="DATA UNAVAILABLE";
}
}
</script>
</body>
</html>
